[project]
name = "osc-nodes"
version = "1.0.0"
description = "A nonoha-engine plugin nodes for OSC (Open Sound Control) communication, providing bidirectional data streaming capabilities between nonoha-engine and OSC-compatible applications."
readme = "README.md"
authors = [{name = "VIE Inc."}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["nonoha", "dataflow", "node-graph", "osc", "open-sound-control", "udp"]
requires-python = ">=3.11"
dependencies = ["python-osc>=1.9,<2", "numpy"]

[project.urls]
Homepage   = "https://github.com/viestyle-dev/osc-nodes"
Repository = "https://github.com/viestyle-dev/osc-nodes"
Issues     = "https://github.com/viestyle-dev/osc-nodes/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "nonoha-core @ git+https://github.com/viestyle-dev/nonoha-core.git@v1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["osc_nodes"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.nonoha-hub]
engine-compatibility = [">=1.0.0", "<2.0.0"]
